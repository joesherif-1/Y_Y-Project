<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='ui.js') }}"></script>
</head>
<body>
    <div class="container">
        <header class="brand">
            <span class="brand-mark">+</span>
            <span>{{ app_name }} <span class="brand-sub">Student Health Project</span></span>
        </header>
        {% block content %}{% endblock %}
        <footer class="footer">
            <p>Educational project &mdash; this tool cannot diagnose cancer. Always talk to a doctor about health concerns.</p>
            <p>Made with love in Saudi Arabia 🇸🇦 by Younus Hassen and Yousef Sherif</p>
        </footer>
    </div>
</body>
</html>
